# Configuration de l'admin MontCafé (Sveltia CMS)
# Seuls les fichiers de src/data/boutique/ sont modifiables ici :
# mentions légales, SEO et coordonnées restent dans data.json, hors de portée.

backend:
  name: github
  repo: ReagZZZz/MontCafe
  branch: main
  commit_messages:
    update: "Admin : mise à jour {{slug}}"

media_folder: public/images
public_folder: /images

collections:
  - name: boutique
    label: Ma boutique
    files:
      # ---------- Annonce ----------
      - name: annonce
        label: Annonce en haut du site
        file: src/data/boutique/annonce.json
        fields:
          - { name: actif, label: Afficher l'annonce, widget: boolean, default: false }
          - name: ton
            label: Type
            widget: select
            default: info
            options:
              - { label: "Nouveauté (vert)", value: nouveaute }
              - { label: "Information (sable)", value: info }
              - { label: "Fermeture (rouge)", value: fermeture }
          - name: texte
            label: Texte
            widget: string
            required: false
            hint: "Une phrase courte. Ex : Arrivage Kenya cette semaine !"

      # ---------- Cafés ----------
      - name: cafes
        label: Cafés du moment
        file: src/data/boutique/cafes.json
        fields:
          - { name: intro, label: Phrase d'introduction, widget: text }
          - name: categories
            label: Rayons
            label_singular: Rayon
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: nom, label: "Nom du rayon (ex : Origines)", widget: string }
              - name: produits
                label: Cafés
                label_singular: Café
                widget: list
                summary: "{{fields.nom}} – {{fields.prix}}"
                fields:
                  - { name: nom, label: Nom, widget: string }
                  - { name: disponible, label: En rayon, widget: boolean, default: true, hint: "Décocher pour masquer le café sans le supprimer (épuisé)." }
                  - { name: origine, label: "Origine ou région", widget: string, required: false }
                  - { name: notes, label: "Arômes", widget: list, required: false, hint: "2 ou 3 arômes, séparés par des virgules. Ex : chocolat, noisette" }
                  - name: torrefaction
                    label: Torréfaction
                    widget: select
                    default: "3"
                    options:
                      - { label: "1 – Très claire", value: "1" }
                      - { label: "2 – Claire", value: "2" }
                      - { label: "3 – Médium", value: "3" }
                      - { label: "4 – Médium foncée", value: "4" }
                      - { label: "5 – Foncée", value: "5" }
                  - { name: prix, label: "Prix (ex : 9,50 €)", widget: string, required: false, hint: "Laisser vide pour ne pas afficher de prix." }
                  - { name: format, label: "Format (ex : 250 g)", widget: string, required: false }

      # ---------- Horaires ----------
      - name: horaires
        label: Horaires d'ouverture
        file: src/data/boutique/horaires.json
        fields:
          - { name: lundi, label: Lundi, widget: string, required: false, hint: "Format : 10:00-12:30, 13:30-19:00. Laisser vide si fermé. Pour une fermeture ponctuelle, utilisez plutôt l'annonce.", pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: mardi, label: Mardi, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: mercredi, label: Mercredi, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: jeudi, label: Jeudi, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: vendredi, label: Vendredi, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: samedi, label: Samedi, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
          - { name: dimanche, label: Dimanche, widget: string, required: false, pattern: ['^$|^\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*(,\s*\d{1,2}[:hH]?\d{0,2}\s*-\s*\d{1,2}[:hH]?\d{0,2}\s*)*$', "Format attendu : 10:00-12:30, 13:30-19:00"] }
