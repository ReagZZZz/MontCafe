# Configuration Netlify : build Astro statique
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# API de l'espace admin : netlify/functions/admin.mts (route /api/admin/*)
[functions]
  directory = "netlify/functions"

# Cache long pour les assets versionnés générés par Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L'espace admin ne doit jamais être mis en cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
